[package]
name = "steamvr_launcher"
version = "1.0.3"
edition = "2021"

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

windows-reactor = "0.100"
windows-core = "0.58"
windows-registry = "0.6"
windows-result = "0.2"
dirs = "5"
lnks = "0.2.0"
rfd = "0.15"

[build-dependencies]
windows-reactor-setup = "0.100"
winres = "0.1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
